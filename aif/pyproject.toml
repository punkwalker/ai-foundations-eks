[project]
name = "aif"
version = "0.1.0"
description = "Provisioning CLI for the AI Foundations on Amazon EKS workshop"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.6",
    "kubernetes>=37.0.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
aif = "aif.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[cloudformation,ec2,ecr,elbv2,iam,resourcegroupstaggingapi,s3,secretsmanager,sts]>=1.44.6",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
# The Kubernetes client ships no type hints. Only aif/kube.py calls it.
untyped_calls_exclude = ["kubernetes"]

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=aif --cov-report=term-missing"
