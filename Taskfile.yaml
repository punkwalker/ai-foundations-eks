---
# Thin launcher. Each task runs exactly one command (decision D5).
# Provisioning logic lives in the aif Python package, not here.
version: "3"

vars:
  UVX: uvx --python 3.13
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e

tasks:
  up:
    desc: Build the lab
    cmd: uv run --directory aif aif up

  down:
    desc: Remove the lab
    cmd: uv run --directory aif aif down

  status:
    desc: Show the state of each stage
    cmd: uv run --directory aif aif status

  doctor:
    desc: Check local tools and access
    cmd: uv run --directory aif aif doctor

  test:
    desc: Run aif unit tests
    cmd: uv run --directory aif pytest

  lint:
    desc: Run every linter and type check
    deps:
      - lint:ruff
      - lint:format
      - lint:mypy
      - lint:yaml
      - lint:cfn
      - lint:kube

  lint:ruff:
    cmd: uv run --directory aif ruff check

  lint:format:
    cmd: uv run --directory aif ruff format --check

  lint:mypy:
    cmd: uv run --directory aif mypy

  lint:yaml:
    cmd: "{{.UVX}} yamllint@1.38.0 --strict ."

  lint:cfn:
    sources:
      - bootstrap/cfn/**/*.yaml
    method: none
    cmds:
      - for: sources
        cmd: "{{.UVX}} cfn-lint@1.60.1 {{.ITEM}}"

  lint:kube:
    cmd: >-
      docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" {{.KUBECONFORM_IMAGE}}
      -strict -summary -ignore-missing-schemas /repo/platform /repo/workloads

  scan:
    desc: Run ASH on the whole repo and fail on any finding
    cmd: >-
      ash --mode container --source-dir . --output-dir .ash
      --fail-on-findings --fail-on-incomplete-scanners
