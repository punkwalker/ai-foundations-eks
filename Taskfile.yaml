---
# Thin launcher. Each task runs exactly one command (decision D5).
# Provisioning logic lives in the aif Python package.
# Every tool comes from mise.toml (decision D11); run `mise install` first.
version: "3"

tasks:
  up:
    desc: "Print the bring-up plan. Example: task up -- --confirm-account ID --apply"
    cmd: uv run --directory aif aif up {{.CLI_ARGS}}

  down:
    desc: "Print the teardown plan. Example: task down -- --confirm-account ID --apply"
    cmd: uv run --directory aif aif down {{.CLI_ARGS}}

  status:
    desc: Show the state of each stage
    cmd: uv run --directory aif aif status

  doctor:
    desc: Show Argo CD mode, sign-in, identity, and health
    cmd: uv run --directory aif aif doctor

  test:
    desc: Run aif unit tests
    cmd: uv run --directory aif pytest

  lint:
    desc: Run every linter and type check
    deps:
      - lint:ruff
      - lint:format
      - lint:mypy
      - lint:yaml
      - lint:kube

  lint:ruff:
    cmd: uv run --directory aif ruff check

  lint:format:
    cmd: uv run --directory aif ruff format --check

  lint:mypy:
    cmd: uv run --directory aif mypy

  lint:yaml:
    cmd: yamllint --strict .

  lint:kube:
    cmd: kubeconform -strict -summary -ignore-missing-schemas platform workloads

  scan:
    desc: Run ASH on the whole repo and fail on any finding
    cmd: >-
      ash --mode container --source-dir . --output-dir .ash
      --fail-on-findings --fail-on-incomplete-scanners --min-severity none
      --config-overrides global_settings.severity_threshold=ALL
