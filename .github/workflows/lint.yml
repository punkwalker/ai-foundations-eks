---
name: lint

on:
  push:
    branches: [dev, "feat/**"]
  pull_request:
    branches: [dev]

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Lint (ruff, mypy --strict, yamllint, cfn-lint, kubeconform)
        run: uvx --from go-task-bin==3.54.0 task lint

      - name: Test (pytest)
        run: uvx --from go-task-bin==3.54.0 task test
