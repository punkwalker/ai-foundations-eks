---
name: lint

on:
  push:
    branches: [dev, "feat/**"]
  pull_request:
    branches: [dev]

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Installs every tool in mise.toml at the versions in mise.lock.
      - name: Install tools with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          version: "2026.11.10"
          install: true
          cache: false

      - name: Lint (ruff, mypy --strict, yamllint, kubeconform)
        run: task lint

      - name: Test (pytest)
        run: task test
