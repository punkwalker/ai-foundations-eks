---
name: ash

on:
  push:
    branches: [dev, "feat/**"]
  pull_request:
    branches: [dev]

permissions: {}

concurrency:
  group: ash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ash:
    name: Automated Security Helper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      # ASH v3.8.0, pinned by commit.
      - name: Install ASH
        run: uv tool install --python 3.13 "git+https://github.com/awslabs/automated-security-helper.git@f356ca77388a4c58bcf25d904a21121ab8872a66"

      # Fails on any finding and on any scanner that did not complete.
      - name: Run ASH
        run: uvx --from go-task-bin==3.54.0 task scan

      - name: Upload ASH report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ash-report
          path: .ash/
          retention-days: 14
          if-no-files-found: warn
