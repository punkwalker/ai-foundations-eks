---
name: ash

on:
  push:
    branches: [dev, "feat/**"]
  pull_request:
    branches: [dev]

permissions: {}

concurrency:
  group: ash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ash:
    name: Automated Security Helper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Installs every tool in mise.toml at the versions in mise.lock.
      - name: Install tools with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          version: "2026.11.10"
          install: true
          cache: false

      # Fails on any finding and on any scanner that did not complete.
      - name: Run ASH
        run: task scan

      - name: Upload ASH report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ash-report
          path: .ash/
          retention-days: 14
          if-no-files-found: warn
